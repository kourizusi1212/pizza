<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pizzeria Online</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"/three/three.module.js"}}</script></head>
<body><canvas id="c"></canvas><div id="fx"></div>
<div id="hud" hidden>
  <div class="pill" id="stats">💰 $<b id="m">0</b>　📅 Day <b id="d">1</b>　✅ <b id="sv">0</b>　😡 <b id="ls">0</b></div>
  <div class="pill right"><span id="rc"></span><button id="bsave">💾 セーブ</button><button id="bexp">⬇ 書き出し</button><button id="bload">📂 ロード</button><button id="bfile">📁 ファイル</button></div>
  <div id="tk" hidden><h3>🧾 注文票</h3><div id="tko"></div><ol id="tks"></ol><div id="tki"></div></div>
  <div id="xh"></div><div id="pr"></div><div id="bk" hidden><i id="bkn"></i></div>
  <div class="pill bottom">WASD 移動　マウス 視点　E 操作　左クリック 作業　Q 取り消し　K セーブ</div>
</div>
<div id="lock" hidden>クリックして操作開始<br><small>Esc で一時停止（メニュー操作）</small></div>
<div id="toast"></div>
<div id="lobby" class="card">
  <h1>🍕 PIZZERIA</h1><p class="sub">注文を受けて、自分の手で焼いて渡そう</p>
  <div id="s1">
    <input id="name" maxlength="12" placeholder="ニックネーム" autocomplete="off"><div id="sw"></div>
    <button id="create" class="big">ルームを作る</button>
    <div class="row"><input id="code" maxlength="4" placeholder="コード4文字" autocomplete="off"><button id="join">参加</button></div>
    <div class="row"><button id="lsave" class="alt">💾 ブラウザのセーブ</button><button id="lfile" class="alt">📁 ファイル</button></div>
    <p id="sinfo"></p><p id="err"></p>
  </div>
  <div id="s2" hidden><p>ルームコード</p><div id="bigcode"></div><ul id="pl"></ul>
    <button id="start" class="big">ゲーム開始</button><p id="wait">ホストの開始を待っています…</p></div>
</div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script type="module" src="game.js"></script></body></html>
